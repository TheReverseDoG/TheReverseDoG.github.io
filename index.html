<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FENG YIZE / FENGYIZE</title>
<meta name="description" content="FENG YIZE，人工智能专业在读。四件做完了的事、一篇在投的论文、一个可以直接写的邮箱。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080A">
<meta property="og:title" content="FENG YIZE / FENGYIZE">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..700;1,100..400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..700;1,100..400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&display=swap">

<style>
/* ============================================================================
   01  TOKENS
   ========================================================================= */
:root{
  --void:      oklch(0.144 0.007 265);
  --surface:   oklch(0.196 0.006 265);
  --ink:       #F2F2F0;
  --ink-2:     #BDBBB3;
  --ink-3:     #8A8880;
  --ink-4:     #4E4E52;
  --rule:      rgb(242 242 240 / .13);
  --rule-soft: rgb(242 242 240 / .07);
  /* One accent, and it is a metal rather than a hue: a matte antique gold at
     8.2:1 on the field. Deliberately dull. Bright gold leaf (#D4AF37 and its
     neighbours) glows against a near-black field and reads as cheap; this reads
     as a printed mark. The neutrals above are warmed a few points to sit beside
     it, so a cool grey does not fight a warm accent. */
  --gold:      #C3A87C;
  --gold-dim:  rgb(195 168 124 / .42);
  --alert:     #C98A7A;          /* edit mode only; warmer than the gold, so the two never blur */
  --mark:      var(--gold);      /* alias, so the old accent name keeps working */

  --f-cjk-serif: "Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --f-lat-serif: "Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --f-display: var(--f-lat-serif);
  --f-meta:    "Archivo","Helvetica Neue",Helvetica,"PingFang SC","Noto Sans SC",sans-serif;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:112px; --s10:160px; --s11:240px;

  --e-expo:  cubic-bezier(.16,1,.3,1);
  --e-power: cubic-bezier(.22,.61,.16,1);
  --stagger: 70ms;
  --spine:   268px;
}
html[data-lang="zh"]{ --f-display: var(--f-cjk-serif) }
html[data-lang="en"]{ --f-display: var(--f-lat-serif) }

*,*::before,*::after{ box-sizing:border-box }
html{ background:var(--void); scroll-behavior:smooth }
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--f-meta); font-weight:300;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}

/* ---------------------------------------------------------------------------
   02  BROWSER SURFACES
   Selection, caret, scrollbar, focus ring, underline offset and the caret belong
   to no design system until they are declared.
   ------------------------------------------------------------------------ */
::selection{ background:var(--mark); color:var(--void) }
html{ caret-color:var(--mark); accent-color:var(--mark) }
:focus{ outline:none }
:focus-visible{ outline:2px solid var(--mark); outline-offset:3px; border-radius:0 }
a{ color:inherit; text-decoration:none; text-underline-offset:.22em; text-decoration-thickness:1px }
*{ scrollbar-width:thin; scrollbar-color:rgb(242 242 240 / .22) transparent }
::-webkit-scrollbar{ width:11px; height:11px }
::-webkit-scrollbar-track{ background:transparent }
::-webkit-scrollbar-thumb{ background:rgb(242 242 240 / .18); border:3px solid var(--void); border-radius:0 }
::-webkit-scrollbar-thumb:hover{ background:rgb(242 242 240 / .3) }
.rail::-webkit-scrollbar{ display:none }

h1,h2,h3,p,ul,ol,li,dl,dt,dd,figure,blockquote{ margin:0; padding:0 }
ul,ol{ list-style:none }
img,svg{ display:block; max-width:100% }
hr{ border:0 }
.vh{ position:absolute!important; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

#grain{
  position:fixed; inset:0; z-index:90; pointer-events:none;
  opacity:.035; mix-blend-mode:screen; background-repeat:repeat; background-size:180px 180px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}

.micro{ font:200 9.5px/1 var(--f-meta); letter-spacing:.2em; text-transform:uppercase }
.num{ font-variant-numeric:tabular-nums }

/* ============================================================================
   03  SPINE
   ========================================================================= */
#spine{
  position:fixed; top:0; left:0; width:var(--spine); height:100svh; z-index:70;
  padding:var(--s6) var(--s5) var(--s5) 0;
  display:flex; flex-direction:column;
  /* A fixed column laid over the flow must not swallow pointer events: anything
     the flow places underneath it stays visible but becomes unclickable. That is
     how the rail's Back button died while Forward worked, purely by x position.
     Only the spine's real controls intercept. */
  pointer-events:none;
}
#spine a, #spine button{ pointer-events:auto }
#spine .chapters{ margin:var(--s10) 0 0; position:relative }
#spine .chapters::before{
  content:""; position:absolute; left:0; top:6px; bottom:6px; width:1px; background:var(--rule);
}
#spine .tick{
  position:relative; display:flex; align-items:baseline; gap:var(--s4);
  padding:var(--s3) 0 var(--s3) var(--s6);
  font:200 11px/1 var(--f-meta); letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); transition:color .4s var(--e-power);
}
#spine .tick .no{ color:var(--ink-4); font-variant-numeric:tabular-nums; transition:color .4s var(--e-power) }
#spine .tick::before{
  content:""; position:absolute; left:-2.5px; top:calc(50% - 3px);
  width:6px; height:1px; background:var(--ink-4);
  transition:background .4s var(--e-power), width .4s var(--e-expo);
}
#spine .tick:hover{ color:var(--ink-2) }
#spine .tick[aria-current="true"]{ color:var(--ink) }
#spine .tick[aria-current="true"] .no{ color:var(--mark) }
#spine .tick[aria-current="true"]::before{ background:var(--mark); width:14px; left:-6.5px }

#spine .foot{ margin-top:auto; padding-left:var(--s6) }
#spine .foot .micro{ color:var(--ink-3); display:block; margin-bottom:var(--s3) }
#spine .foot .mail{
  font:400 15px/1.4 var(--f-meta); color:var(--ink); letter-spacing:.01em;
  border-bottom:1px solid var(--rule); padding-bottom:2px;
  transition:border-color .4s var(--e-power);
}
#spine .foot .mail:hover{ border-color:var(--mark) }
#spine .bars{ display:flex; gap:var(--s5); margin-top:var(--s6) }
#spine .bars a{
  font:200 9.5px/1 var(--f-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3);
  transition:color .35s var(--e-power);
}
#spine .bars a:hover{ color:var(--ink) }

#spine .tools{ display:flex; align-items:center; gap:var(--s5); margin-top:var(--s6) }
#lang{ display:inline-flex; align-items:baseline; gap:7px; font:200 10px/1 var(--f-meta); letter-spacing:.16em }
#lang button, #edit-toggle{
  appearance:none; background:none; border:0; padding:2px 0; cursor:pointer;
  color:var(--ink-4); font:inherit; letter-spacing:inherit;
  border-bottom:1px solid transparent;
  transition:color .3s var(--e-power), border-color .3s var(--e-power);
}
#lang button:hover, #edit-toggle:hover{ color:var(--ink-2) }
#lang button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--mark) }
#lang .sep{ color:var(--ink-4) }
#edit-toggle{ font:200 10px/1 var(--f-meta); letter-spacing:.16em; text-transform:uppercase }
#edit-toggle[aria-pressed="true"]{ color:var(--alert); border-bottom-color:var(--alert) }

#spine .progress{
  position:absolute; left:0; top:var(--s6); bottom:var(--s5); width:1px;
  background:var(--mark); transform-origin:0 50%; scale:1 0;
}
@supports (animation-timeline: scroll()){
  #spine .progress{ animation:grow linear both; animation-timeline:scroll(root block) }
}
@keyframes grow{ from{ scale:1 0 } to{ scale:1 1 } }

/* ============================================================================
   04  FLOW  ·  type roles
   ========================================================================= */
#flow{ margin-left:var(--spine); max-width:1200px; padding-right:var(--s8) }
.chapter{
  min-height:100svh; display:flex; flex-direction:column; justify-content:center;
  padding:var(--s10) 0;
}
.chapter > header{ margin-bottom:var(--s8) }
#work{ min-height:0; padding-bottom:var(--s9) }

/* --- the masthead: the name is the page -------------------------------- */
#masthead{ padding:var(--s9) 0 var(--s8); display:block }
#masthead .hero{
  display:grid; grid-template-columns:minmax(0,1fr) 280px;
  gap:var(--s7); align-items:start;
}
#masthead .name{
  font-family:var(--f-display); font-weight:400; display:block;
  font-size:clamp(34px,4.7vw,72px); line-height:1.04; letter-spacing:-.02em;
  text-wrap:balance;
}
#masthead .name .cjk{
  display:block; font-family:var(--f-cjk-serif);
  font-size:clamp(26px,3.1vw,50px); letter-spacing:.02em;
  color:var(--ink-2); margin-top:var(--s2);
}
html[data-lang="en"] #masthead .name{ line-height:1.02; letter-spacing:-.035em }
html[data-lang="en"] #masthead .name .cjk{ font-size:clamp(18px,2vw,30px); letter-spacing:.14em; margin-top:var(--s3) }
html[data-lang="zh"] #masthead .name{ letter-spacing:.01em }

#masthead .statement{
  font-family:var(--f-display); font-weight:400; color:var(--ink-2);
  font-size:clamp(20px,2.2vw,32px); line-height:1.26; letter-spacing:-.015em;
  margin-top:var(--s6); max-width:26ch; text-wrap:balance;
}
html[data-lang="zh"] #masthead .statement{ line-height:1.4; letter-spacing:0; font-size:clamp(18px,2vw,28px) }
html[data-lang="en"] #masthead .statement{ max-width:24ch }

#masthead .lede{ margin-top:var(--s7) }
#masthead .facts{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--s7); margin-top:var(--s8); border-top:1px solid var(--rule); padding-top:var(--s5);
}
#masthead .facts > div{ min-width:0 }
#masthead .facts dt{ font:200 11px/1 var(--f-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s3) }
#masthead .facts dd{ font:300 15px/1.8 var(--f-meta); color:var(--ink-2) }

#masthead .portrait{ margin-top:var(--s2) }

h2.title{
  font-family:var(--f-display); font-weight:400;
  font-size:clamp(30px,3.1vw,50px); line-height:1.12; letter-spacing:-.025em;
  text-wrap:balance;
}
html[data-lang="zh"] h2.title{ line-height:1.18; letter-spacing:-.015em }
html[data-lang="en"] h2.title{ letter-spacing:-.03em }

/* Type roles. Body sits above the 16px floor on purpose: this page is dark,
   light-weight and wide-set, all three of which read smaller than they measure. */
.lede{ font-weight:300; color:var(--ink-2); font-size:18px; line-height:1.8; max-width:58ch; letter-spacing:.004em }
p.body{ font-weight:300; color:var(--ink-2); font-size:16.5px; line-height:1.82; max-width:56ch; letter-spacing:.004em }
.note{ font:300 15px/1.85 var(--f-meta); color:var(--ink-3); max-width:50ch }
html[data-lang="zh"] .lede{ line-height:1.9 }
html[data-lang="zh"] p.body{ line-height:1.92 }
html[data-lang="en"] .lede{ font-size:19px }
html[data-lang="en"] p.body{ font-size:17px; line-height:1.8 }

.head{ display:grid; grid-template-columns:minmax(0,1fr) 268px; gap:var(--s7); align-items:start }
.head .contents{ font:300 14px/1.9 var(--f-meta); color:var(--ink-3); letter-spacing:.02em }
html[data-lang="en"] .head .contents{ font-size:13.5px; letter-spacing:.01em }

/* ============================================================================
   05  PHOTOGRAPHS
   Real photos take the place of the reserved slots. One treatment everywhere:
   full column width, hairline edge, desaturated into the page's one-colour
   world. A photo that arrives in colour still belongs.
   ========================================================================= */
#masthead .hero figure,
.plate-item figure,
#papers figure{ margin:0 }
#masthead .hero figure img,
.plate-item figure img,
#papers figure img{
  width:100%; height:auto; display:block;
  border:1px solid var(--rule);
  filter:grayscale(1) contrast(1.08) brightness(.94);
}
/* Two of these are photographs whose intended crop is panoramic. attr() is not
   dependable inside aspect-ratio yet, so the two crops are declared here, one
   class each, and they match the width/height already written on the tag. */
.is-wide16x6{ aspect-ratio:1600 / 567; object-fit:cover }
.is-band24x7{ aspect-ratio:2400 / 700; object-fit:cover }

/* ============================================================================
   06  WORK · the rail
   ========================================================================= */
.railbox{ position:relative; margin-left:calc(var(--s9) * -1); --rail-pad:780px }
.railbox::before{
  content:""; position:absolute; left:64px; top:var(--s5); bottom:var(--s5);
  width:1px; background:var(--rule-soft);
}
.rail{
  position:relative; display:flex; gap:var(--s8);
  overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory; scrollbar-width:none;
  padding:var(--s3) var(--rail-pad) var(--s6) 0;
}
.rail::-webkit-scrollbar{ display:none }
.plate-item{
  flex:0 0 auto; width:640px; scroll-snap-align:start;
  display:grid; grid-template-columns:64px minmax(0,1fr); gap:var(--s6);
}
.plate-item .slug{
  writing-mode:vertical-rl; justify-self:center;
  font:200 11px/1 var(--f-meta); letter-spacing:.3em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap;
}
.plate-item .slug b{ font-weight:400; color:var(--mark) }
.plate-item h3{
  font-family:var(--f-display); font-weight:400; letter-spacing:-.02em;
  font-size:clamp(26px,2.5vw,38px); line-height:1.16; max-width:19ch; text-wrap:balance;
}
html[data-lang="zh"] .plate-item h3{ line-height:1.24; letter-spacing:-.01em }
.plate-item .yr{
  font:200 12px/1 var(--f-meta); letter-spacing:.22em; color:var(--mark);
  display:block; margin-bottom:var(--s4); font-variant-numeric:tabular-nums;
}
.plate-item p{ margin-top:var(--s5) }
.plate-item figure{ margin-top:var(--s6) }

/* Same left edge as the plate text: the controls belong to the rail, not to the
   breakout margin the rail itself uses. Kept off the spine column on purpose. */
.railfoot{
  display:flex; align-items:center; gap:var(--s5);
  font:200 11px/1 var(--f-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3);
}
.railfoot .btn{
  appearance:none; background:none; border:1px solid var(--rule); color:var(--ink-2);
  width:38px; height:30px; cursor:pointer; padding:0; font:300 13px/1 var(--f-meta);
  transition:color .3s var(--e-power), border-color .3s var(--e-power);
}
.railfoot .btn:hover{ color:var(--ink); border-color:var(--mark) }
.railfoot .btn:active{ translate:0 1px }
.railfoot .pips{ display:flex; gap:6px; margin-left:auto }
.railfoot .pips i{ width:22px; height:2px; background:var(--rule); transition:background .35s var(--e-power) }
.railfoot .pips i[data-on="1"]{ background:var(--mark) }
.railfoot .key{ color:var(--ink-4) }

/* ============================================================================
   07  FIGURE · the graph is the engine
   Nodes carry a value on the forward pass and fill a gradient slot as the
   backward pass reaches them. Drawn geometry, no illustration.
   ========================================================================= */
.grad{ margin-top:var(--s6) }
.grad svg{ width:100%; height:auto; overflow:visible; display:block }

.grad__fx{
  font-family:var(--f-lat-serif); font-weight:400; color:var(--ink);
  font-size:clamp(20px,1.9vw,26px); letter-spacing:-.01em; margin-bottom:var(--s5);
}
.grad .ge{ fill:none; stroke:rgb(242 242 240 / .16); stroke-width:1; transition:stroke .35s var(--e-power), stroke-width .35s var(--e-power) }
.grad .ge.is-lit{ stroke:rgb(242 242 240 / .34) }
.grad .ge.is-now{ stroke:var(--mark); stroke-width:1.6 }

.grad .gn rect{ fill:none; stroke:rgb(242 242 240 / .3); stroke-width:1; transition:stroke .35s var(--e-power), fill .35s var(--e-power) }
.grad .gn--leaf rect{ stroke-dasharray:3 3 }
.grad .gn .gop{ font:400 15px var(--f-lat-serif); fill:var(--ink); letter-spacing:0 }
.grad .gn .gval{ font:300 11px var(--f-meta); fill:var(--ink-3); font-variant-numeric:tabular-nums }
.grad .gn .ggrad{ font:400 13px var(--f-meta); fill:var(--mark); font-variant-numeric:tabular-nums; letter-spacing:.02em }
.grad .gn.is-done rect{ stroke:rgb(195 168 124 / .45) }
.grad .gn.is-on rect{ fill:rgb(195 168 124 / .14); stroke:var(--mark) }

.grad__bar{ display:flex; align-items:center; gap:var(--s5); margin-top:var(--s5) }
.grad__bar .btn{
  appearance:none; background:none; border:1px solid var(--rule); color:var(--ink-2);
  cursor:pointer; padding:9px 13px;
  font:200 11px/1 var(--f-meta); letter-spacing:.14em;
  transition:color .3s var(--e-power), border-color .3s var(--e-power);
}
.grad__bar .btn:hover{ color:var(--ink); border-color:var(--mark) }
.grad__bar .btn:active{ translate:0 1px }
.grad__bar .btn[disabled]{ opacity:.3; cursor:default; color:var(--ink-4); border-color:var(--rule-soft) }
.grad__count{
  margin-left:auto; font:200 11px/1 var(--f-meta); letter-spacing:.18em;
  color:var(--ink-3); font-variant-numeric:tabular-nums;
}
.grad__rule{
  margin-top:var(--s4); min-height:3.4em;
  font:300 14px/1.7 var(--f-meta); color:var(--ink-2); max-width:46ch;
}

/* ============================================================================
   08  PAPERS
   One reserved row, waiting. A placeholder is honest only when it is visibly a
   placeholder, so the dashes are dim and the row is scoped: nothing here claims
   a paper exists.
   ========================================================================= */
#papers .head{ margin-bottom:var(--s8) }

.list{ margin-top:var(--s8); border-top:1px solid var(--rule) }
.paper{
  display:grid; grid-template-columns:82px minmax(0,1fr) 224px;
  gap:var(--s6); padding:var(--s6) 0; border-bottom:1px solid var(--rule-soft);
  align-items:baseline;
}
.paper .yr{
  font:200 12px/1.6 var(--f-meta); letter-spacing:.2em;
  color:var(--gold); font-variant-numeric:tabular-nums;
}
.paper .ttl{
  font-family:var(--f-display); font-weight:400; letter-spacing:-.015em;
  font-size:clamp(21px,1.9vw,28px); line-height:1.3; max-width:36ch;
}
html[data-lang="zh"] .paper .ttl{ line-height:1.42; letter-spacing:0; font-size:clamp(20px,1.7vw,26px) }
.paper .meta{
  font:200 11.5px/1.9 var(--f-meta); letter-spacing:.12em;
  color:var(--ink-3); text-transform:uppercase; text-align:right;
}
.paper .meta b{ display:block; font-weight:400; color:var(--ink-2) }
.paper .st{ display:block; margin-top:var(--s2); color:var(--ink-4) }
.paper .st[data-state="accepted"]{ color:var(--gold) }
/* the reserved row: dim, but it still reads. The year mark is not allowed to
   glow, and the empty title slot keeps its line box so the row is not a sliver. */
.paper--awaiting .yr{ color:var(--ink-4) }
.paper--awaiting .ttl{ min-height:1.3em }
.paper--awaiting .meta b{ color:var(--ink-3); text-transform:none; letter-spacing:.06em }

/* ============================================================================
   09  CONTACT
   ========================================================================= */
#contact{ padding-bottom:var(--s11) }
#contact .spread{
  display:grid; grid-template-columns:minmax(0,1.5fr) 230px; gap:var(--s8);
  align-items:start; margin-top:var(--s8);
}
#contact .mail{
  display:inline-block; font-family:var(--f-meta); font-weight:300;
  font-size:clamp(26px,3.6vw,50px); line-height:1.2; letter-spacing:-.015em;
  border-bottom:1px solid var(--rule); padding-bottom:var(--s3);
  transition:border-color .45s var(--e-power); overflow-wrap:anywhere;
}
#contact .mail:hover{ border-color:var(--mark) }
#contact .aside{ border-top:1px solid var(--rule); padding-top:var(--s4) }
#contact .aside .row{ display:flex; justify-content:space-between; gap:var(--s4); padding:var(--s3) 0; border-bottom:1px solid var(--rule-soft) }
#contact .aside .row a{
  font:200 10px/1 var(--f-meta); letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3);
  transition:color .35s var(--e-power);
}
#contact .aside .row a:hover{ color:var(--mark) }
#contact .aside .row span{ font:200 10px/1 var(--f-meta); letter-spacing:.16em; color:var(--ink-4) }
#flow .colophon{
  margin-top:var(--s10); padding-top:var(--s5); border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:var(--s6); flex-wrap:wrap;
  font:300 12px/1.9 var(--f-meta); letter-spacing:.02em; color:var(--ink-3);
}
#flow .colophon .num{ color:var(--ink-2) }

/* ============================================================================
   10  EDIT MODE
   Editing is a mode, so it looks like one: the editable regions are the only
   things that change appearance, and the export panel is unmistakable.
   ========================================================================= */
body[data-edit="1"] [data-copy]{
  outline:1px dashed rgb(201 138 122 / .5); outline-offset:4px;
  cursor:text; transition:outline-color .3s var(--e-power), background .3s var(--e-power);
}
body[data-edit="1"] [data-copy]:hover{ outline-color:var(--alert); background:rgb(201 138 122 / .05) }
body[data-edit="1"] [data-copy]:focus{ outline:1px solid var(--alert); background:rgb(201 138 122 / .07) }
body[data-edit="1"] #editbar{ display:flex }
/* The edit bar spans the viewport bottom and sits above the spine in the layer
   order, so it covers the spine's own tools. They cannot be reached while the
   bar is up, and switching language mid-edit would repaint the fields anyway:
   disable them and say so, rather than leaving a control that looks live and
   silently swallows clicks. The bar's own Done button is the exit. */
body[data-edit="1"] #spine .tools{ pointer-events:none; opacity:.35 }

#editbar{
  position:fixed; left:0; right:0; bottom:0; z-index:95;
  display:none; align-items:center; gap:var(--s5); flex-wrap:wrap;
  padding:var(--s4) var(--s5);
  background:var(--void); border-top:1px solid var(--alert);
  font:300 12px/1.6 var(--f-meta); color:var(--ink-2);
}
/* While the export dialog is up it owns the screen. The bar is above it in the
   layer order, so leaving it in place makes the dialog's own buttons dead. */
body:has(#export[data-open="1"]) #editbar{ display:none }
#editbar .tag{
  font:200 9.5px/1 var(--f-meta); letter-spacing:.2em; text-transform:uppercase;
  color:var(--alert); border:1px solid rgb(201 138 122 / .45); padding:5px 8px 4px;
}
#editbar .grow{ margin-left:auto }
#editbar button{
  appearance:none; cursor:pointer; font:200 10px/1 var(--f-meta);
  letter-spacing:.16em; text-transform:uppercase;
  padding:8px 11px; border:1px solid var(--rule); color:var(--ink-2); background:none;
  transition:color .3s var(--e-power), border-color .3s var(--e-power);
}
#editbar button:hover{ color:var(--ink); border-color:var(--mark) }
#editbar button[data-emph]{ border-color:rgb(201 138 122 / .5); color:var(--alert) }
#editbar button[data-emph]:hover{ color:var(--void); background:var(--alert); border-color:var(--alert) }

#export{
  position:fixed; inset:0; z-index:96; display:none;
  align-items:center; justify-content:center; padding:var(--s6);
  background:rgb(8 8 10 / .86);
}
#export[data-open="1"]{ display:flex }
#export .panel{
  width:min(860px,100%); max-height:82svh; display:flex; flex-direction:column;
  background:var(--void); border:1px solid var(--rule); padding:var(--s6);
}
#export h2{ font:400 22px/1.3 var(--f-display); letter-spacing:-.02em }
#export p{ margin-top:var(--s3); font:300 13px/1.7 var(--f-meta); color:var(--ink-3); max-width:60ch }
#export textarea{
  flex:1; min-height:220px; margin-top:var(--s5); resize:vertical;
  background:var(--surface); color:var(--ink-2); border:1px solid var(--rule);
  font:300 12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding:var(--s4); letter-spacing:0;
}
#export .acts{ display:flex; gap:var(--s4); margin-top:var(--s5); flex-wrap:wrap }
#export .acts button{
  appearance:none; cursor:pointer; font:200 10px/1 var(--f-meta);
  letter-spacing:.16em; text-transform:uppercase;
  padding:9px 12px; border:1px solid var(--rule); color:var(--ink-2); background:none;
  transition:color .3s var(--e-power), border-color .3s var(--e-power);
}
#export .acts button:hover{ color:var(--ink); border-color:var(--mark) }
#export .acts button[data-emph]{ border-color:rgb(201 138 122 / .5); color:var(--alert) }
#export .acts button[data-emph]:hover{ color:var(--void); background:var(--alert); border-color:var(--alert) }
#export .note{ margin-top:var(--s4); font:300 12px/1.7 var(--f-meta); color:var(--ink-4) }

/* ============================================================================
   11  MOTION
   ========================================================================= */
@media (prefers-reduced-motion: no-preference){
  .rv{ opacity:0; transform:translateY(18px); transition:opacity .75s var(--e-expo), transform .75s var(--e-expo) }
  .rv.in{ opacity:1; transform:none }
  .rv:nth-child(2){ transition-delay:var(--stagger) }
  .rv:nth-child(3){ transition-delay:calc(var(--stagger) * 2) }
  .rv:nth-child(4){ transition-delay:calc(var(--stagger) * 3) }

  /* the signature moment: the name is uncovered as if being set, once */
  #masthead .name{ clip-path:inset(0 100% 0 0); animation:uncover 1.2s var(--e-expo) .1s forwards }
  @keyframes uncover{ to{ clip-path:inset(0 -3% 0 0) } }

  #spine .tick{ animation:slidein .5s var(--e-expo) both }
  #spine .tick:nth-child(2){ animation-delay:70ms }
  #spine .tick:nth-child(3){ animation-delay:140ms }
  @keyframes slidein{ from{ opacity:0; transform:translateX(-10px) } to{ opacity:1; transform:none } }
}

/* ============================================================================
   12  RESPONSIVE
   ========================================================================= */
@media (max-width:1023px){
  :root{ --spine:0px }
  #spine{
    position:sticky; width:auto; height:auto; padding:var(--s3) var(--s4);
    flex-direction:row; align-items:center; gap:var(--s4);
    background:rgb(8 8 10 / .94); border-bottom:1px solid var(--rule);
  }
  #spine .progress{ display:none }
  #spine .chapters{ margin:0 0 0 auto; display:flex; gap:var(--s4); overflow-x:auto; scrollbar-width:none }
  #spine .chapters::before{ display:none }
  #spine .tick{ padding:0; font-size:10px; letter-spacing:.12em; white-space:nowrap }
  #spine .tick::before{ display:none }
  #spine .foot{ display:flex; align-items:center; margin:0; padding:0; gap:var(--s3) }
  #spine .foot .micro, #spine .foot .mail, #spine .bars{ display:none }
  #spine .tools{ margin:0 }
  #flow{ margin-left:0; max-width:none; padding:0 var(--s4) }
  .chapter{ min-height:0; padding:var(--s9) 0; scroll-margin-top:70px }
  #masthead{ padding:var(--s8) 0 var(--s7); scroll-margin-top:70px }
  #masthead .hero{ grid-template-columns:1fr; gap:var(--s6) }
  #masthead .name{ margin-left:0 }
  #masthead .portrait{ max-width:300px; margin-top:0; order:-1 }
  #masthead .hero > .col-a{ order:1 }
  #masthead .facts{ grid-template-columns:1fr; gap:var(--s5); margin-top:var(--s8) }
  h2.title{ font-size:clamp(24px,6vw,34px) }
  .head{ grid-template-columns:1fr; gap:var(--s5) }
  .railbox{ margin-left:0; --rail-pad:0px }
  .railbox::before{ display:none }
  .rail{ gap:var(--s6) }
  .plate-item{ display:block; width:86vw; max-width:470px }
  .plate-item + .plate-item{ margin-left:var(--s6) }
  .plate-item .slug{ writing-mode:horizontal-tb; display:block; justify-self:start; text-align:left; margin-bottom:var(--s4) }
  .railfoot{ margin-left:0; padding-left:0; flex-wrap:wrap }
  .railfoot .key{ display:none }
  #contact .spread{ grid-template-columns:1fr; gap:var(--s6) }
  .paper{ grid-template-columns:1fr; gap:var(--s2); padding:var(--s5) 0 }
  .paper .meta{ text-align:left; margin-top:var(--s2) }
  .paper .st{ display:inline; margin:0 }
}
@media (max-width:600px){

@media (prefers-reduced-motion: reduce){

    exportOut.value = buildSnippet(false);
    exportOut.focus();
    exportOut.select();
  });

  window.__copyState = function () {
    return { lang: lang, edit: editOn, overrides: overrides,
             changed: changedKeys().length,
             missing: Object.keys(COPY.zh).filter(function (k) { return !(k in COPY.en); })
               .concat(Object.keys(COPY.en).filter(function (k) { return !(k in COPY.zh); })) };
  };
})();
</script>

</body>
</html>
